<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My 3D Landing</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            margin: 60px auto;
            padding: 32px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px
        }

        p {
            margin: 0 0 18px;
            color: #333
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            background: #111;
            color: white;
            text-decoration: none
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <!-- <main class="content">
        <h1>Hi — my 3D landing</h1>
        <p>Simple static site with a WebGL background. Expand this into a full interactive 3D UI.</p>
        <a class="btn" href="#" id="action">Explore</a>
    </main> -->

    <!-- Three.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
    <script>
        // Basic three.js scene: rotating colorful torus knot
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // lighting
        const light = new THREE.DirectionalLight(0xffffff, 1.0);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));

        // geometry
        const geometry = new THREE.TorusKnotGeometry(1, 0.35, 200, 32);
        const material = new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.7 });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // color animation
        let t = 0;
        function animate() {
            requestAnimationFrame(animate);
            t += 0.01;
            mesh.rotation.x += 0.007;
            mesh.rotation.y += 0.01;
            // animate color hue
            const hue = (Math.sin(t * 0.5) * 0.5 + 0.5);
            const color = new THREE.Color().setHSL(hue, 0.65, 0.55);
            material.color.copy(color);
            renderer.render(scene, camera);
        }
        animate();

        // responsive
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // optional: simple interaction
        document.getElementById('action').addEventListener('click', (e) => {
            e.preventDefault();
            mesh.rotation.x += 1.2;
            mesh.rotation.y += 1.2;
        });
    </script>
</body>

</html>
